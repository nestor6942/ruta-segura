services:
  - type: web
    name: ruta-segura-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: TWILIO_WHATSAPP_NUMBER
        value: whatsapp:+14155238886
